name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build application code
        run: npm run build

  platform-package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
            wasmtime_asset: wasmtime-v50.0.1-aarch64-macos.tar.xz
            archive: tar.xz
            sha256: 960e5216c7ebd7e9b45e6561d15821b8b801b7d54aee28c7b91921aeb30c65c8
          - label: macOS x64
            runner: macos-15-intel
            wasmtime_asset: wasmtime-v50.0.1-x86_64-macos.tar.xz
            archive: tar.xz
            sha256: ea1818fa8cbb51524847ab2ad22197e0051594fdc96cbd0cc2afb65832e11925
          - label: Windows x64
            runner: windows-latest
            wasmtime_asset: wasmtime-v50.0.1-x86_64-windows.zip
            archive: zip
            sha256: c3646ee2de8cfcefe532e75852e1fd2728d78c3fcc43251794803a698d1c30ca
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download Wasmtime
        shell: bash
        run: |
          curl -fL "https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.1/${{ matrix.wasmtime_asset }}" -o "$RUNNER_TEMP/wasmtime-archive"
          node -e 'const fs=require("fs");const crypto=require("crypto");const actual=crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex");if(actual!==process.argv[2])throw new Error("Wasmtime archive SHA-256 mismatch: "+actual)' "$RUNNER_TEMP/wasmtime-archive" "${{ matrix.sha256 }}"
          mkdir -p "$RUNNER_TEMP/wasmtime"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            python -c "import zipfile; zipfile.ZipFile(r'$RUNNER_TEMP/wasmtime-archive').extractall(r'$RUNNER_TEMP/wasmtime')"
          else
            tar -xJf "$RUNNER_TEMP/wasmtime-archive" -C "$RUNNER_TEMP/wasmtime"
          fi
          WASMTIME_PATH="$(find "$RUNNER_TEMP/wasmtime" -type f \( -name wasmtime -o -name wasmtime.exe \) | head -n 1)"
          test -n "$WASMTIME_PATH"
          echo "DESKTOP_AGENT_WASMTIME_BIN=$WASMTIME_PATH" >> "$GITHUB_ENV"
          echo "DESKTOP_AGENT_RUST_TOOLCHAIN_DIR=$(rustc --print sysroot)" >> "$GITHUB_ENV"
      - name: Build real platform installer and verify bundled WASI runtime
        run: npm run package
      - name: Mount DMG and test the installed app resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find release -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/desktop-agent-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          export DESKTOP_AGENT_RUST_SANDBOX_DIR="$app/Contents/Resources/rust-sandbox"
          node scripts/check-rust-sandbox.mjs
          hdiutil detach "$mount"
      - name: Install NSIS package and test installed app resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          $installDir = Join-Path $env:RUNNER_TEMP "desktop-agent-installed"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer failed with exit code $($process.ExitCode)." }
          $env:DESKTOP_AGENT_RUST_SANDBOX_DIR = Join-Path $installDir "resources\rust-sandbox"
          node scripts/check-rust-sandbox.mjs
          if ($LASTEXITCODE -ne 0) { throw "Installed WASI resource integration test failed." }
      - name: Report installer size and signing state
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print -exec du -h {} \;
          echo "Unsigned CI artifact: signing/notarization credentials are not configured in CI."
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-agent-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
